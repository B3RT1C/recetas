name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please don't paste tokens, cookies, `secret.key` or real Instagram captions/handles."
  - type: input
    id: version
    attributes: {label: Version, placeholder: v2.1.2}
    validations: {required: true}
  - type: dropdown
    id: os
    attributes: {label: OS, options: [Windows, Linux, macOS, Other]}
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected vs actual behaviour}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes: {label: Logs, render: text}
