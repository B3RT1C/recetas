name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem / use case}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed solution}
  - type: checkboxes
    id: roadmap
    attributes:
      label: Checks
      options:
        - label: I checked docs/ROADMAP.md
